<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>בדיחה בלחיצה</title>
  <meta name="description" content="כותבים נושא, לוחצים, וצוחקים.">
  <meta name="theme-color" content="#FFE15A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap">
  <style>
    :root {
      --sun: #FFE15A;
      --paper: #FFFFFF;
      --ink: #2B1E4A;
      --ink-soft: #4A3D6B;
      --red: #F23D2F;
      --blue: #2E9BFF;
      --error: #C0261B;
      --error-bg: #FFE8EC;
      --hint: #756B92;
      --gap: 14px;
      --ui-font: "Fredoka", system-ui, sans-serif;
      --joke-font: "Playpen Sans Hebrew", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100dvh;
      background-color: var(--sun);
      background-image: url("assets/bg-doodles.svg"), url("assets/bg-dots.svg");
      background-repeat: no-repeat, repeat;
      background-position: top center, 0 0;
      background-size: 440px auto, 16px 16px;
      color: var(--ink);
      font-family: var(--ui-font);
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 440px;
      margin: 0 auto;
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .logo {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
      margin: 6px auto 0;
    }

    .intro {
      margin: 0;
      text-align: center;
      font-size: 17px;
      line-height: 1.4;
      color: var(--ink-soft);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    label {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: -6px;
    }

    .topic {
      width: 100%;
      font: 500 19px var(--ui-font);
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 4px 4px 0 var(--ink);
      transform: rotate(0.6deg);
      outline: none;
    }
    .topic::placeholder { color: var(--hint); opacity: 1; }
    .topic:focus-visible { box-shadow: 4px 4px 0 var(--ink), 0 0 0 4px var(--blue); }

    .go {
      width: 100%;
      min-height: 64px;
      font: 700 24px var(--ui-font);
      color: #fff;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink);
      transform: rotate(-1deg);
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .go:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
    .go:active,
    .go:disabled {
      transform: rotate(-1deg) translateY(6px);
      box-shadow: 0 2px 0 var(--ink);
    }
    .go:disabled { cursor: progress; }

    /* בועת הבדיחה */
    .bubble {
      position: relative;
      min-height: 190px;
      margin-top: 10px;
      padding: 22px 20px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-1.2deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .mascot {
      width: 118px;
      height: auto;
      transform-origin: 50% 100%;
    }

    .message {
      margin: 0;
      font-size: 17px;
      line-height: 1.45;
      color: var(--ink-soft);
      overflow-wrap: anywhere;
    }

    .bubble[data-state="idle"] .mascot { animation: bob 2.4s ease-in-out infinite; }
    .bubble[data-state="think"] .mascot { animation: squash .5s ease-in-out infinite alternate; }

    .bubble[data-state="joke"] {
      align-items: stretch;
      text-align: start;
      padding-top: 30px;
    }
    .bubble[data-state="joke"] .mascot {
      position: absolute;
      top: -44px;
      right: -14px;
      width: 86px;
      transform: rotate(8deg);
      transform-origin: 50% 70%;
      animation: giggle .35s ease-in-out 4;
    }
    .bubble[data-state="joke"] .message {
      font-family: var(--joke-font);
      font-size: 25px;
      line-height: 1.55;
      color: var(--ink);
    }

    .bubble[data-state="error"] { background: var(--error-bg); }
    .bubble[data-state="error"] .mascot { animation: wobble .45s ease-in-out 2; }
    .bubble[data-state="error"] .message { color: var(--error); font-weight: 600; }

    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes squash { to { transform: scaleY(.86) scaleX(1.06); } }
    @keyframes giggle {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-6deg) translateY(-3px); }
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-9deg); }
      75% { transform: rotate(9deg); }
    }

    .footer {
      margin-top: auto;
      padding-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 style="margin:0"><img class="logo" src="assets/logo.svg" width="300" height="158" alt="בדיחה בלחיצה"></h1>
    <p class="intro">כותבים נושא, לוחצים, וצוחקים.<br>בלי נושא, מקבלים בדיחה כללית.</p>

    <form id="form" novalidate>
      <label for="topic">על מה הבדיחה?</label>
      <input class="topic" id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off" enterkeyhint="go">
      <button class="go" id="go" type="submit">תנו לי בדיחה!</button>
    </form>

    <section class="bubble" id="bubble" data-state="idle">
      <img class="mascot" id="mascot" src="assets/mascot-idle.svg" width="118" height="110" alt="">
      <p class="message" id="message" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    </section>

    <footer class="footer">מיישם AI ואוטומציה · 53500</footer>
  </main>

  <script>
    const form = document.getElementById("form");
    const topicInput = document.getElementById("topic");
    const button = document.getElementById("go");
    const bubble = document.getElementById("bubble");
    const mascot = document.getElementById("mascot");
    const message = document.getElementById("message");

    const buttonText = { idle: "תנו לי בדיחה!", think: "חושב...", joke: "עוד בדיחה!", error: "לנסות שוב" };

    function show(state, text) {
      bubble.dataset.state = state;
      mascot.src = `assets/mascot-${state}.svg`;
      message.textContent = text;
      button.textContent = buttonText[state];
      button.disabled = state === "think";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const topic = topicInput.value.trim().slice(0, 100);
      show("think", topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה...");

      try {
        const response = await fetch("/api/joke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic }),
        });
        const data = await response.json();
        if (response.ok && data.joke) {
          show("joke", data.joke);
        } else {
          show("error", data.error || "משהו השתבש. נסו שוב.");
        }
      } catch {
        show("error", "אין חיבור לשרת כרגע. נסו שוב.");
      }
    });

    // טוענים מראש את הציורים, כדי שהחלפת מצב לא תהבהב
    for (const state of ["think", "joke", "error"]) new Image().src = `assets/mascot-${state}.svg`;

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch((err) => console.error("service worker:", err));
    }
  </script>
</body>
</html>
